services:
  wcd-dev:
    image: wcd-dev
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - dev-home:/home/dev      # persists credentials, AVD, gradle cache across runs
      - ./patches:/output
      - ${HOME}/.claude:/host-claude:ro
    devices:
      - /dev/kvm
    shm_size: '4g'
    mem_limit: 24g
    security_opt:
      - label:disable  # SELinux labeling disabled: container storage lives on /home (bind mount)
      - seccomp:unconfined
    stdin_open: true
    tty: true

volumes:
  dev-home:
    external: true
    name: wcd_dev-home
