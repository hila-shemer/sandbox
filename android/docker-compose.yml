services:
  wcd-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - gradle-cache:/home/dev/.gradle
      - ./patches:/output
    devices:
      - /dev/kvm
    security_opt:
      - label:disable  # SELinux labeling disabled: container storage lives on /home (bind mount)
    stdin_open: true
    tty: true

volumes:
  gradle-cache:
