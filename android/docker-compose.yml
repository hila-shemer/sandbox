services:
  wcd-dev:
    image: wcd-dev
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - dev-home:/home/dev      # persists credentials, AVD, gradle cache across runs
      - ./patches:/output
      - ${HOME}/.claude:/host-claude:ro
    environment:
      - ADB_TARGET=cuttlefish:6520
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute]
    shm_size: '8g'
    mem_limit: 24g
    security_opt:
      - label:disable  # SELinux labeling disabled: container storage lives on /home (bind mount)
      - seccomp:unconfined
    stdin_open: true
    tty: true
    depends_on:
      cuttlefish:
        condition: service_healthy

  cuttlefish:
    image: us-docker.pkg.dev/android-cuttlefish-artifacts/cuttlefish-orchestration/cuttlefish-orchestration:stable
    privileged: true
    volumes:
      - ./entrypoint-cuttlefish.sh:/entrypoint-cuttlefish.sh:ro
      - cf-images:/root/cf_images
    entrypoint: ["/entrypoint-cuttlefish.sh"]
    ports:
      - "6520:6520"     # ADB (also reachable as cuttlefish:6520 from other services)
      - "1443:1443"     # Web UI
    shm_size: '2g'
    mem_limit: 8g
    healthcheck:
      test: ["CMD-SHELL", "/root/cf_images/bin/adb -s 0.0.0.0:6520 shell getprop sys.boot_completed 2>/dev/null | grep -q 1"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 10

volumes:
  dev-home:
    external: true
    name: wcd_dev-home
  cf-images:
