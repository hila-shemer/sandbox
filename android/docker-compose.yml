services:
  wcd-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount source code so edits are live
      - ./app/src:/app/app/src
      # Persist Gradle cache across container restarts
      - gradle-cache:/root/.gradle
    devices:
      - /dev/kvm
    security_opt:
      - label:disable  # SELinux labeling disabled: container storage lives on /home (bind mount)
    stdin_open: true
    tty: true

volumes:
  gradle-cache:
