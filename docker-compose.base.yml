# Shared service definition for loop/ and android/ variants.
# Variant compose files extend `claude-common` here and add their own
# image name, persistent home volume, mem_limit, and (for android) the
# cuttlefish sidecar. Volumes from the base concatenate with the variant's,
# so the variant-specific /home/dev mount must NOT be declared here.
services:
  claude-common:
    build:
      context: ${PROJECT_DIR:?set PROJECT_DIR=/abs/path/to/project}
      dockerfile: ${SANDBOX_DIR:?set SANDBOX_DIR=/abs/path/to/sandbox}/Dockerfile
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
    volumes:
      - claude-app:/app
      - ${SANDBOX_DIR}/entrypoint.sh:/entrypoint.sh:ro,z
      - ${SANDBOX_DIR}/save-patch:/usr/local/bin/save-patch:ro,z
      - ${SANDBOX_DIR}/screenshot:/usr/local/bin/screenshot:ro,z
      - ${SANDBOX_DIR}/ralph:/opt/ralph:ro,z
      - ${PROJECT_DIR}/patches:/output:z
      - ${PROJECT_DIR}/.notes:/home/dev/notes:z
      - ${HOME}/.claude:/host-claude:ro,z
    shm_size: '8g'
    stdin_open: true
    tty: true
